<!DOCTYPE html>
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale=1.0">

    <title>Personal Finance Tracker | Transaction</title>
    <link rel="stylesheet" href="css/transaction.css">
    <script type=""module" src="js/transaction.js"><
    </script>
</head>

<body>

    <main class="container">

        <header class="page-header">
            <div>
                <h1>Transactions</h1>
                <p></p>
            </div>
        </header>
    </main>
</body>
</html>

<section class="transaction-form-section">
    <h2>Add Transactions</h2>
    <form id=""transaction-form">
        <div class="form-group">
            <label for="type">Transaction Type</label> 
            <select id="type" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
            </option>
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Amount ($)</label>
                <input
                    type="number"
                    id="amount"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter amount"
                    required
                >
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
                <option value="">Select category</option>
            </select>
        </div>
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
        </div>
        <button type="submit" id="submit-button">
            Add Transaction
        </button>
    </form>

    <p id="form-message" role="status" aria-live="polite"></p>

</section>

<secion class="transaction-history">
    <h2>Transaction History</h2>

    <div id="transaction-list">
        <p>No transaction yet.
        </p>
    </div>
</secion>

</main>
